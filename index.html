<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zenith | Cinematic Essentials</title>

    <link rel="icon" type="image/png" href="./assets/logo-favicon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/style.css" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  </head>
  <body>
    <nav
      class="navbar"
      style="
        border-bottom: 1px solid var(--border-subtle);
        background: rgba(10, 10, 10, 0.9);
        flex-wrap: wrap;
      "
    >
      <div
        style="
          display: flex;
          justify-content: space-between;
          align-items: center;
          width: 100%;
        "
      >
        <div class="nav-brand" style="display: flex; align-items: center">
          <button
            class="nav-icon-btn"
            id="nav-back"
            style="display: none; margin-right: 1.5rem; font-size: 1.2rem"
          >
            &larr;
          </button>
          <img src="./assets/logo-navbar.png" id="nav-brand-img" />
        </div>

        <div class="nav-menu">
          <button class="nav-link" id="nav-home">Home</button>
          <button class="nav-link" id="nav-shop">Collections</button>
          <button class="nav-link" id="nav-about">The Heritage</button>
          <button
            class="nav-link hidden"
            id="nav-dashboard"
            style="color: var(--accent-primary)"
          >
            Dashboard
          </button>
        </div>

        <div class="nav-actions">
          <button
            class="nav-icon-btn"
            id="nav-search"
            style="margin-right: 1.5rem"
          >
            Search
          </button>
          <button class="nav-icon-btn" id="nav-profile">Sign In</button>
          <button class="nav-icon-btn" id="nav-cart">
            Cart (<span id="cart-count">0</span>)
          </button>
        </div>
      </div>

      <div
        id="search-tray"
        class="search-tray hidden"
        style="
          position: fixed;
          top: 80px;
          left: 0;
          width: 100%;
          background: rgba(10, 10, 10, 0.97);
          backdrop-filter: blur(12px);
          border-bottom: 1px solid var(--border-subtle);
          padding: 1.5rem 5%;
          z-index: 999;
          box-sizing: border-box;
        "
      >
        <div
          style="
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            width: 100%;
            box-sizing: border-box;
          "
        >
          <input
            type="text"
            id="search-input"
            placeholder="Search the anthology..."
            autocomplete="off"
            spellcheck="false"
            style="
              flex: 1;
              min-width: 0;
              background: transparent;
              border: none;
              color: var(--text-primary);
              font-family: var(--font-sans);
              font-size: 1.1rem;
              outline: none;
              padding-right: 1rem;
            "
          />
          <button
            id="close-search"
            class="nav-icon-btn"
            style="font-size: 1.2rem; flex-shrink: 0; cursor: pointer"
          >
            &times;
          </button>
        </div>

        <div
          id="search-results"
          class="search-results-grid"
          style="
            max-height: 50vh;
            overflow-y: auto;
            overflow-x: hidden;
            width: 100%;
            box-sizing: border-box;
          "
        ></div>
      </div>
    </nav>

    <div id="toast" class="toast hidden"></div>

    <main id="view-home" class="view active"></main>
    <main id="view-shop" class="view hidden"></main>
    <main id="view-product-detail" class="view hidden"></main>
    <main id="view-cart" class="view hidden"></main>
    <main id="view-checkout" class="view hidden"></main>
    <main id="view-auth" class="view hidden"></main>
    <main id="view-profile" class="view hidden"></main>
    <main id="view-about" class="view hidden"></main>
    <main id="view-seller-dashboard" class="view hidden"></main>
    <main id="view-order-success" class="view hidden"></main>
    <main id="view-track-order" class="view hidden"></main>
    <main id="view-legal" class="view hidden"></main>

    <footer
      class="footer"
      style="
        border-top: 1px solid var(--border-subtle);
        margin-top: auto;
        padding: 4rem 5%;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      "
    >
      <div
        class="footer-links"
        style="
          display: flex;
          gap: 2.5rem;
          flex-wrap: wrap;
          justify-content: center;
        "
      >
        <a href="javascript:void(0)" onclick="openLegal('shipping')"
          >Shipping & Returns</a
        >
        <a href="javascript:void(0)" onclick="openLegal('privacy')"
          >Privacy Policy</a
        >
        <a href="javascript:void(0)" onclick="openLegal('terms')"
          >Terms of Service</a
        >
        <a href="javascript:void(0)" onclick="openLegal('contact')">Contact</a>
      </div>
    </footer>
    <script type="module" src="./js/app.js"></script>
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </body>
</html>
